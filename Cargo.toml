[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Arithmetic in the simulation reproduces the original's 16-bit behaviour with
# explicit wrapping operations; overflow checks stay on in release builds so
# an accidental overflow shows up as a panic instead of a silent difference.
[profile.release]
overflow-checks = true
debug = 1
